<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<title>The Abomination — 3D object</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "/node_modules/three/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "/node_modules/three/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "/node_modules/three/examples/jsm/exporters/GLTFExporter.js"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#efe9df}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="the-abomination" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  flesh:  new THREE.MeshStandardMaterial({ name:'grave_flesh',  color:0x8b7c74, roughness:0.88, metalness:0.0 }),
  bruise: new THREE.MeshStandardMaterial({ name:'bruised_meat', color:0x6a565c, roughness:0.82, metalness:0.0 }),
  pale:   new THREE.MeshStandardMaterial({ name:'pale_skin',    color:0xb3a493, roughness:0.86, metalness:0.0 }),
  bone:   new THREE.MeshStandardMaterial({ name:'bone',         color:0xd6c9ae, roughness:0.62, metalness:0.0 }),
  sinew:  new THREE.MeshStandardMaterial({ name:'sinew',        color:0xa1706a, roughness:0.70, metalness:0.0 }),
  gore:   new THREE.MeshStandardMaterial({ name:'clotted_gore', color:0x5e2a27, roughness:0.60, metalness:0.0 }),
  void:   new THREE.MeshStandardMaterial({ name:'socket_dark',  color:0x241d1f, roughness:0.95, metalness:0.0 }),
  tooth:  new THREE.MeshStandardMaterial({ name:'tooth',        color:0xe2d9c2, roughness:0.45, metalness:0.0 }),
};
const FLESHES = [M.flesh, M.bruise, M.pale];

const rig = new THREE.Group(); rig.name = 'the_abomination';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const add = (geo, mat, name, parent) => { const m = new THREE.Mesh(geo, mat); m.name = name; (parent || rig).add(m); return m; };

let seed = 20260914;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length) % arr.length];

/* push every vertex along its normal by a smooth pseudo-noise field: nothing on this
   creature is a clean surface, and the field is continuous so seams stay welded */
function lumpy(geo, amp, freq, s) {
  const p = geo.attributes.position, n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const d = amp * (
      Math.sin(x * freq + s) * Math.sin(y * freq * 1.37 + s * 2.1) * Math.sin(z * freq * 0.83 + s * 3.7) +
      0.45 * Math.sin(x * freq * 2.3 + s * 1.7) * Math.sin(z * freq * 2.9 + s * 0.6)
    );
    p.setXYZ(i, x + n.getX(i) * d, y + n.getY(i) * d, z + n.getZ(i) * d);
  }
  geo.computeVertexNormals();
  return geo;
}
function blobGeo(r, amp, s, seg = 26) { return lumpy(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.7)), amp, 2.2 / r, s); }

function bar(a, b, r0, r1, name, mat, parent, seg = 12) {
  const A = a.clone(), B = b.clone();
  const m = add(new THREE.CylinderGeometry(r1, r0, A.distanceTo(B), seg, 1), mat, name, parent);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), B.clone().sub(A).normalize());
  return m;
}
function joint(p, r, name, mat, parent) {
  const m = add(new THREE.SphereGeometry(r, 12, 10), mat, name, parent);
  m.position.copy(p); return m;
}

/* ===================== THE MASS ===================== */
/* a squat heap, not a body: overlapping deformed lumps with no axis of symmetry */
const CX = V(0, 2.05, 0), EX = 1.85, EY = 1.22, EZ = 1.58;
const mass = new THREE.Group(); mass.name = 'mass'; rig.add(mass);

const LUMPS = [
  [ 0.00,  0.00,  0.00, 1.30], [ 0.86,  0.16, -0.36, 0.98], [-0.82, -0.06,  0.30, 1.04],
  [ 0.24,  0.52,  0.62, 0.86], [-0.30,  0.46, -0.66, 0.80], [ 0.62, -0.48,  0.58, 0.82],
  [-0.66, -0.46, -0.50, 0.78], [ 1.12, -0.26,  0.42, 0.66], [-1.16,  0.22, -0.18, 0.62],
  [ 0.10,  0.84, -0.10, 0.70], [ 0.44, -0.72, -0.28, 0.60], [-0.34, -0.74,  0.40, 0.58],
  [ 1.02,  0.54,  0.10, 0.54], [-0.92,  0.56,  0.46, 0.50],
];
LUMPS.forEach(([x, y, z, r], i) => {
  const m = add(blobGeo(r, r * 0.20, i * 1.7 + 0.4), i % 3 === 1 ? M.bruise : M.flesh, 'lump_' + i, mass);
  m.position.copy(CX).add(V(x, y, z));
  m.scale.set(R(0.95, 1.2), R(0.74, 0.9), R(0.95, 1.2));
  m.rotation.set(R(0, 3), R(0, 3), R(0, 3));
});

/* seams of fused gore packed into the valleys between lumps */
for (let i = 0; i < 14; i++) {
  const a = LUMPS[i % LUMPS.length], b = LUMPS[(i * 5 + 3) % LUMPS.length];
  const p = CX.clone().add(V((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2).multiplyScalar(1.04));
  const m = add(blobGeo(R(0.18, 0.30), 0.06, i * 2.3), M.gore, 'seam_' + i, mass);
  m.position.copy(p); m.scale.set(R(1, 1.5), R(0.5, 0.8), R(1, 1.5)); m.rotation.y = R(0, 3);
}

function anchor(theta, phi, out = 1) {
  const st = Math.sin(theta);
  return CX.clone().add(V(EX * st * Math.cos(phi) * out, EY * Math.cos(theta) * out, EZ * st * Math.sin(phi) * out));
}
const outward = (p) => p.clone().sub(CX).divide(V(EX, EY, EZ)).normalize();

/* ===================== HEADS ===================== */
/* each one half-swallowed by the heap, facing whatever direction it was rolled into */
function head(p, dir, r, name, parent, mat) {
  const g = new THREE.Group(); g.name = name; g.position.copy(p);
  g.quaternion.setFromUnitVectors(V(0, 0, 1), dir.clone().normalize());
  g.rotateZ(R(-0.5, 0.5)); g.rotateX(R(-0.35, 0.35));
  parent.add(g);

  const skull = add(blobGeo(r, r * 0.12, r * 40), mat, name + '_skull', g);
  skull.scale.set(0.92, 1.08, 1.0);
  /* jaw hangs clear of the skull so the face reads as a face at model scale */
  const jaw = add(blobGeo(r * 0.58, r * 0.1, r * 61), mat, name + '_jaw', g);
  jaw.position.set(0, -r * 0.78, r * 0.72); jaw.scale.set(0.95, 0.5, 0.95);
  jaw.rotation.x = 0.45;
  for (const s of [1, -1]) {
    const brow = add(blobGeo(r * 0.24, r * 0.06, r * 31 + s), mat, name + '_brow_' + (s > 0 ? 'l' : 'r'), g);
    brow.position.set(s * r * 0.36, r * 0.42, r * 0.80); brow.scale.set(1.25, 0.5, 0.7);
    const sock = add(new THREE.SphereGeometry(r * 0.32, 14, 12), M.void, name + '_socket_' + (s > 0 ? 'l' : 'r'), g);
    sock.position.set(s * r * 0.36, r * 0.12, r * 0.98); sock.scale.set(1, 0.9, 0.7);
    add(new THREE.SphereGeometry(r * 0.14, 10, 8), M.pale, name + '_eye_' + (s > 0 ? 'l' : 'r'), g)
      .position.set(s * r * 0.36, r * 0.12, r * 1.08);
  }
  const mouth = add(new THREE.SphereGeometry(r * 0.44, 16, 12), M.void, name + '_maw', g);
  mouth.position.set(0, -r * 0.44, r * 0.98); mouth.scale.set(0.95, 0.8, 0.6);
  for (let i = 0; i < 6; i++) {
    const t = add(new THREE.ConeGeometry(r * 0.055, r * 0.20, 6), M.tooth, name + '_tooth_' + i, g);
    const up = i % 2 === 0;
    t.position.set((i - 2.5) * r * 0.12, -r * (up ? 0.20 : 0.66), r * 1.06);
    t.rotation.x = up ? Math.PI : 0;
  }
  return g;
}

const heads = new THREE.Group(); heads.name = 'heads'; rig.add(heads);
const HEAD_AT = [
  [0.70, 0.35], [1.05, 2.05], [0.55, 3.55], [1.25, 4.60], [0.35, 5.60],
  [1.45, 1.10], [1.60, 3.05], [0.95, 5.10], [1.90, 4.05],
];
HEAD_AT.forEach(([th, ph], i) => {
  const p = anchor(th, ph, 0.94);
  const dir = outward(p);
  const r = R(0.26, 0.36);
  head(p.clone().add(dir.clone().multiplyScalar(r * 0.45)), dir, r, 'head_' + i, heads, i % 4 === 2 ? M.pale : (i % 3 ? M.flesh : M.bruise));
});

/* ===================== LIMBS ===================== */
/* nothing is hinged to a skeleton: arms and legs sprout where the corpses happened to
   land, and whichever ones reach the ground are the ones it walks on */
const limbs = new THREE.Group(); limbs.name = 'limbs'; rig.add(limbs);

/* dir = the way the fingers point; backUp = which way the back of the hand faces
   (local +z). Planted hands get backUp = world up, so the palm lies flat and the
   curl is slackened to keep fingertips from digging through the floor. */
function hand(p, dir, r, name, parent, mat, backUp) {
  const g = new THREE.Group(); g.name = name; g.position.copy(p);
  const yA = dir.clone().normalize();
  let zA = (backUp || V(0, 0, 1)).clone();
  if (Math.abs(zA.dot(yA)) > 0.94) zA = Math.abs(yA.y) > 0.9 ? V(0, 0, 1) : V(0, 1, 0);
  zA.sub(yA.clone().multiplyScalar(zA.dot(yA))).normalize();
  const xA = new THREE.Vector3().crossVectors(yA, zA).normalize();
  g.setRotationFromMatrix(new THREE.Matrix4().makeBasis(xA, yA, zA));
  parent.add(g);
  const curl = backUp ? 0.2 : 1;
  const palm = add(blobGeo(r * 1.5, r * 0.2, r * 90), mat, name + '_palm', g);
  palm.scale.set(1.0, 0.8, 0.5);
  for (let i = 0; i < 4; i++) {
    const a = (i - 1.5) * 0.36;
    const base = V(Math.sin(a) * r * 1.1, r * 0.6, Math.cos(a) * r * 0.5 * curl);
    const mid = base.clone().add(V(Math.sin(a) * r * 1.2, r * 1.1, Math.cos(a) * r * 0.5 * curl));
    const tip = mid.clone().add(V(Math.sin(a) * r * 1.5, r * 0.5, Math.cos(a) * r * 0.9 * curl));
    bar(base, mid, r * 0.3, r * 0.26, name + '_finger_' + i + '_a', mat, g, 8);
    bar(mid, tip, r * 0.26, r * 0.18, name + '_finger_' + i + '_b', mat, g, 8);
    joint(mid, r * 0.27, name + '_knuckle_' + i, mat, g);
  }
  const thumb = V(-r * 1.3, r * 0.2, r * 0.5 * curl);
  bar(V(-r * 0.8, r * 0.3, 0), thumb, r * 0.3, r * 0.2, name + '_thumb', mat, g, 8);
  return g;
}
/* dir is the direction the limb travels INTO the foot, so the ankle end of the
   sole (local +y) points back up the leg */
function foot(p, dir, r, name, parent, mat) {
  const g = new THREE.Group(); g.name = name; g.position.copy(p);
  g.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().negate().normalize());
  g.rotateY(R(0, 6.28)); parent.add(g);
  const sole = add(blobGeo(r * 1.7, r * 0.18, r * 70), mat, name + '_sole', g);
  sole.scale.set(0.8, 0.42, 1.25); sole.position.y = r * 0.6;
  const heel = add(blobGeo(r * 0.9, r * 0.14, r * 51), mat, name + '_heel', g);
  heel.position.set(0, r * 0.7, -r * 1.2);
  for (let i = 0; i < 4; i++) {
    add(blobGeo(r * 0.34, r * 0.08, i * 3.1), mat, name + '_toe_' + i, g)
      .position.set((i - 1.5) * r * 0.42, r * 0.34, r * 1.9);
  }
  return g;
}

/* a limb: two or three tapering segments with a lump at each kink */
function limb(pts, r0, name, mat) {
  for (let i = 0; i < pts.length - 1; i++) {
    const t0 = i / (pts.length - 1), t1 = (i + 1) / (pts.length - 1);
    bar(pts[i], pts[i + 1], r0 * (1 - t0 * 0.45), r0 * (1 - t1 * 0.45), name + '_seg_' + i, mat, limbs, 14);
    if (i > 0) joint(pts[i], r0 * (1 - t0 * 0.4) * 1.18, name + '_joint_' + i, mat, limbs);
  }
  joint(pts[0], r0 * 1.25, name + '_root', mat, limbs);
}

/* the five that currently reach the ground — the heap's legs for this moment only */
const STANCE = [
  { th: 2.35, ph: 0.55, kind: 'leg',  foot: V( 1.55, 0, 0.95), knee: V( 1.66, 0.98,  0.30) },
  { th: 2.55, ph: 2.55, kind: 'leg',  foot: V(-1.45, 0, 1.15), knee: V(-1.34, 0.86,  0.52) },
  { th: 2.45, ph: 3.95, kind: 'leg',  foot: V(-1.70, 0,-1.05), knee: V(-1.40, 1.06, -0.42) },
  { th: 2.20, ph: 5.35, kind: 'arm',  foot: V( 1.15, 0,-1.85), knee: V( 1.28, 1.14, -1.05) },
  { th: 1.85, ph: 1.55, kind: 'arm',  foot: V( 2.60, 0, 2.05), knee: V( 2.08, 1.42,  1.35) },
];
const LEAN = -0.045;   // the heap's tilt, pre-compensated so every contact lands level
STANCE.forEach((s, i) => {
  s.foot.y = -LEAN * s.foot.x;
  const root = anchor(s.th, s.ph, 0.9);
  const mat = pick(FLESHES);
  const isLeg = s.kind === 'leg';
  const r = isLeg ? R(0.20, 0.25) : R(0.13, 0.17);
  const reach = s.foot.clone().sub(s.knee).setY(0).normalize();   // fingers splay outward
  const palmP = s.foot.clone(); palmP.y += r * 0.30;
  const ankle = isLeg ? s.foot.clone().add(V(0, r * 1.7, 0)) : palmP.clone().add(V(0, r * 0.7, 0)).sub(reach.clone().multiplyScalar(r * 0.9));
  limb([root, s.knee, ankle], r, (isLeg ? 'stance_leg_' : 'stance_arm_') + i, mat);
  if (isLeg) foot(s.foot.clone(), V(0, -1, 0), r * 0.95, 'stance_foot_' + i, limbs, mat);
  else hand(palmP, reach, r * 0.95, 'stance_hand_' + i, limbs, mat, V(0, 1, 0));
});

/* and the rest: limbs that just flail, clutch at the mass, or hang dead */
const LOOSE = [
  [0.55, 0.90, 'arm'], [0.80, 2.90, 'arm'], [1.20, 1.70, 'arm'], [1.35, 5.90, 'arm'],
  [1.70, 2.20, 'arm'], [0.40, 4.40, 'arm'], [1.95, 0.20, 'leg'], [2.05, 4.90, 'leg'],
  [1.15, 3.35, 'arm'], [1.55, 4.55, 'leg'], [0.95, 0.10, 'arm'], [2.10, 2.95, 'arm'],
];
LOOSE.forEach(([th, ph, kind], i) => {
  const root = anchor(th, ph, 0.9);
  const dir = outward(root);
  const mat = pick(FLESHES);
  const isLeg = kind === 'leg';
  const r = isLeg ? R(0.17, 0.22) : R(0.11, 0.15);
  const L1 = isLeg ? R(0.7, 0.95) : R(0.5, 0.75);
  const L2 = isLeg ? R(0.6, 0.85) : R(0.45, 0.7);
  const bend = V(R(-0.6, 0.6), R(-0.9, 0.3), R(-0.6, 0.6));
  const mid = root.clone().add(dir.clone().multiplyScalar(L1)).add(bend);
  const end = mid.clone().add(dir.clone().multiplyScalar(L2 * 0.6))
    .add(V(R(-0.5, 0.5), R(-0.9, 0.5), R(-0.5, 0.5)).multiplyScalar(L2));
  if (end.y < 0.6) end.y = 0.6 + rnd() * 0.35;   // only the stance limbs take weight
  limb([root, mid, end], r, (isLeg ? 'loose_leg_' : 'loose_arm_') + i, mat);
  const d = end.clone().sub(mid).normalize();
  if (isLeg) foot(end.clone(), d, r * 0.85, 'loose_foot_' + i, limbs, mat);
  else hand(end.clone(), d, r * 0.9, 'loose_hand_' + i, limbs, mat);
});

/* ===================== BONE AND SINEW ===================== */
const debris = new THREE.Group(); debris.name = 'bone_and_sinew'; rig.add(debris);

/* ribs that never found a chest to belong to, breaking the surface */
for (let i = 0; i < 9; i++) {
  const p = anchor(R(0.4, 2.2), R(0, 6.28), 0.86);
  const dir = outward(p);
  const rib = add(new THREE.TorusGeometry(R(0.22, 0.38), 0.035, 7, 16, Math.PI * R(0.5, 0.95)), M.bone, 'rib_' + i, debris);
  rib.position.copy(p).add(dir.clone().multiplyScalar(0.06));
  rib.quaternion.setFromUnitVectors(V(0, 0, 1), dir);
  rib.rotateZ(R(0, 6.28));
}
/* snapped long bones jutting out */
for (let i = 0; i < 7; i++) {
  const p = anchor(R(0.3, 2.3), R(0, 6.28), 0.9);
  const dir = outward(p).add(V(R(-0.4, 0.4), R(-0.3, 0.3), R(-0.4, 0.4))).normalize();
  const len = R(0.35, 0.7);
  bar(p, p.clone().add(dir.clone().multiplyScalar(len)), 0.055, 0.04, 'bone_shard_' + i, M.bone, debris, 10);
  joint(p.clone().add(dir.clone().multiplyScalar(len)), 0.065, 'bone_knob_' + i, M.bone, debris);
}
/* strands of sinew stretched taut across the gaps as the mass shifts */
for (let i = 0; i < 16; i++) {
  const a = anchor(R(0.3, 2.4), R(0, 6.28), 0.93);
  const b = anchor(R(0.3, 2.4), R(0, 6.28), 0.93);
  if (a.distanceTo(b) > 2.4 || a.distanceTo(b) < 0.5) continue;
  bar(a, b, R(0.012, 0.028), R(0.012, 0.028), 'sinew_' + i, M.sinew, debris, 6);
}

/* ===================== SETTLE ONTO THE GROUND ===================== */
rig.rotation.z = LEAN;   // the whole heap leans into its own dragging motion
rig.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(rig);
const c = box.getCenter(V());
const wrap = new THREE.Group(); wrap.name = 'abomination'; wrap.add(rig);
rig.position.set(-c.x, -box.min.y, -c.z);

stage.setObject(wrap);
</script>
</body>
</html>
