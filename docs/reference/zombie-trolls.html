<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<title>Zombie trolls — 3D object</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "/node_modules/three/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "/node_modules/three/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "/node_modules/three/examples/jsm/exporters/GLTFExporter.js"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#efe9df}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="zombie-trolls" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  hide:   new THREE.MeshStandardMaterial({ name:'troll_hide',   color:0x7b8171, roughness:0.90, metalness:0.0 }),
  hideDk: new THREE.MeshStandardMaterial({ name:'grave_hide',   color:0x686b5e, roughness:0.90, metalness:0.0 }),
  bruise: new THREE.MeshStandardMaterial({ name:'bruised_meat', color:0x6a565c, roughness:0.82, metalness:0.0 }),
  pale:   new THREE.MeshStandardMaterial({ name:'pale_skin',    color:0xb3a493, roughness:0.86, metalness:0.0 }),
  bone:   new THREE.MeshStandardMaterial({ name:'bone',         color:0xd6c9ae, roughness:0.62, metalness:0.0 }),
  sinew:  new THREE.MeshStandardMaterial({ name:'sinew',        color:0xa1706a, roughness:0.70, metalness:0.0 }),
  gore:   new THREE.MeshStandardMaterial({ name:'clotted_gore', color:0x5e2a27, roughness:0.60, metalness:0.0 }),
  void:   new THREE.MeshStandardMaterial({ name:'socket_dark',  color:0x241d1f, roughness:0.95, metalness:0.0 }),
  tooth:  new THREE.MeshStandardMaterial({ name:'tooth',        color:0xe2d9c2, roughness:0.45, metalness:0.0 }),
  eye:    new THREE.MeshStandardMaterial({ name:'witchlight',   color:0xbcd9a8, roughness:0.3, metalness:0.0, emissive:0x4d6b3a, emissiveIntensity:0.8 }),
  hair:   new THREE.MeshStandardMaterial({ name:'grave_hair',   color:0x2b2622, roughness:0.95, metalness:0.0 }),
  iron:   new THREE.MeshStandardMaterial({ name:'black_iron',   color:0x3e3b39, roughness:0.62, metalness:0.75 }),
  rust:   new THREE.MeshStandardMaterial({ name:'rust',         color:0x6d4530, roughness:0.85, metalness:0.25 }),
  wood:   new THREE.MeshStandardMaterial({ name:'split_wood',   color:0x5c4632, roughness:0.88, metalness:0.0 }),
  bark:   new THREE.MeshStandardMaterial({ name:'dead_bark',    color:0x46372a, roughness:0.95, metalness:0.0 }),
  leather:new THREE.MeshStandardMaterial({ name:'rotted_leather',color:0x453427, roughness:0.90, metalness:0.0 }),
  cloth:  new THREE.MeshStandardMaterial({ name:'grave_cloth',  color:0x6a6258, roughness:0.95, metalness:0.0 }),
  fletch: new THREE.MeshStandardMaterial({ name:'crow_fletch',  color:0x26231f, roughness:0.92, metalness:0.0 }),
};

const rig = new THREE.Group(); rig.name = 'zombie_trolls';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const add = (geo, mat, name, parent) => { const m = new THREE.Mesh(geo, mat); m.name = name; parent.add(m); return m; };
let seed = 90412277;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const Y = V(0, 1, 0);

function bar(a, b, r0, r1, name, mat, parent, seg = 10) {
  const m = add(new THREE.CylinderGeometry(r1, r0, a.distanceTo(b), seg, 1), mat, name, parent);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(Y, b.clone().sub(a).normalize());
  return m;
}
/* an ellipsoid mass — every muscle and gut of a troll is one of these */
function blob(c, r, mat, name, parent, rot) {
  const m = add(new THREE.SphereGeometry(1, 16, 12), mat, name, parent);
  m.position.copy(c); m.scale.copy(r);
  if (rot) m.rotation.set(rot.x, rot.y, rot.z);
  return m;
}
/* an ellipsoid stretched along a segment (bicep, forearm, calf) */
function sausage(a, b, t, rw, rl, mat, name, parent) {
  const m = blob(a.clone().lerp(b, t), V(rw, rl, rw * 0.92), mat, name, parent);
  m.quaternion.setFromUnitVectors(Y, b.clone().sub(a).normalize());
  return m;
}
const onSurf = (c, r, u) => { const n = u.clone().normalize(); return V(c.x + r.x * n.x, c.y + r.y * n.y, c.z + r.z * n.z); };

/* ============================ THE CLUB ============================
   A felled trunk along local +y from the butt: bark shaft swelling to a
   gnarled head, leather-wrapped grip, iron bands and hammered spikes. */
function club(parent, name, len, headR) {
  const g = new THREE.Group(); g.name = name; parent.add(g);
  const rAt = (y) => 0.11 + (headR - 0.11) * Math.pow(y / len, 1.4);
  add(new THREE.CylinderGeometry(headR, 0.11, len, 12, 4), M.bark, name + '_trunk', g).position.y = len * 0.5;
  add(new THREE.SphereGeometry(headR * 1.05, 14, 10), M.bark, name + '_head', g).position.y = len;
  add(new THREE.CylinderGeometry(0.128, 0.122, 0.46, 10), M.leather, name + '_grip', g).position.y = 0.38;
  add(new THREE.SphereGeometry(0.12, 10, 8), M.wood, name + '_butt', g).position.y = 0.0;
  for (let i = 0; i < 5; i++) {
    const y = len * R(0.30, 0.92), a = R(0, 6.28), r = rAt(y);
    blob(V(Math.cos(a) * r * 0.8, y, Math.sin(a) * r * 0.8), V(r * 0.45, r * 0.6, r * 0.45), M.bark, name + '_knot_' + i, g);
  }
  for (const f of [0.60, 0.78]) {
    const y = len * f, band = add(new THREE.TorusGeometry(rAt(y) + 0.012, 0.028, 6, 18), M.iron, name + '_band_' + f, g);
    band.rotation.x = Math.PI / 2; band.position.y = y;
  }
  let k = 0;
  for (let row = 0; row < 3; row++) {
    const y = len * (0.84 + row * 0.055);
    for (let j = 0; j < 6; j++) {
      const a = j * Math.PI / 3 + row * 0.5 + R(-0.2, 0.2), out = V(Math.cos(a), R(-0.1, 0.25), Math.sin(a)).normalize();
      const sp = add(new THREE.ConeGeometry(0.038, 0.24, 5), M.rust, name + '_spike_' + (k++), g);
      sp.position.set(0, y, 0).add(out.clone().multiplyScalar(rAt(y) + 0.08));
      sp.quaternion.setFromUnitVectors(Y, out);
    }
  }
  for (let i = 0; i < 3; i++) {
    const y = len * R(0.82, 0.98), a = R(0, 6.28), r = rAt(y);
    blob(V(Math.cos(a) * r * 0.85, y, Math.sin(a) * r * 0.85), V(0.14, 0.10, 0.14), M.gore, name + '_gore_' + i, g);
  }
  return g;
}
function bolt(parent, name, a, b, r) {
  bar(a, b, r, r, name + '_shaft', M.wood, parent, 5);
  const d = b.clone().sub(a).normalize();
  for (let i = 0; i < 2; i++) {
    const f = add(new THREE.BoxGeometry(0.006, 0.12, 0.05), M.fletch, name + '_fletch_' + i, parent);
    f.position.copy(b).sub(d.clone().multiplyScalar(0.07));
    f.quaternion.setFromUnitVectors(Y, d); f.rotateY(i * Math.PI / 2);
  }
}

/* ============================ ONE TROLL ============================
   Hunched: hips at ~2.0, the hump the highest point of the body, the head
   slung low and forward beneath it, arms long enough to drag the ground. */
function troll(o) {
  const { name, pose } = o;
  const F = o.skin, g = new THREE.Group(); g.name = name;
  const swing = pose === 'swing';

  /* legs — short, bowed and massive; each sole blob sits exactly on y = 0 */
  const front = swing ? -1 : 1;
  for (const s of [1, -1]) {
    const sd = s > 0 ? 'l' : 'r', fw = s === front;
    const hip = V(s * 0.48, 2.0, -0.05);
    const knee = V(s * 0.70, 1.12, fw ? 0.55 : -0.05);
    const ankle = V(s * 0.66, 0.34, fw ? 0.55 : -0.40);
    bar(hip, knee, 0.42, 0.31, name + '_thigh_' + sd, F, g, 14);
    sausage(hip, knee, 0.4, 0.44, 0.5, F, name + '_quad_' + sd, g);
    blob(knee, V(0.31, 0.29, 0.31), F, name + '_knee_' + sd, g);
    bar(knee, ankle, 0.30, 0.21, name + '_shin_' + sd, F, g, 12);
    sausage(knee, ankle, 0.3, 0.33, 0.36, F, name + '_calf_' + sd, g);
    blob(ankle, V(0.23, 0.2, 0.23), F, name + '_ankle_' + sd, g);
    const fz = ankle.z + 0.20;
    blob(V(ankle.x, 0.17, fz), V(0.31, 0.17, 0.48), F, name + '_foot_' + sd, g);
    for (let i = -1; i <= 1; i++) {
      blob(V(ankle.x + i * 0.15, 0.09, fz + 0.43), V(0.10, 0.09, 0.13), F, name + '_toe_' + sd + '_' + (i + 1), g);
      const nail = add(new THREE.BoxGeometry(0.08, 0.04, 0.06), M.tooth, name + '_toenail_' + sd + '_' + (i + 1), g);
      nail.position.set(ankle.x + i * 0.15, 0.1, fz + 0.54);
    }
  }

  /* trunk masses */
  const HIPS = [V(0, 2.05, 0), V(0.75, 0.55, 0.6)];
  const BELLY = [V(0, 2.35, 0.35), V(0.78, 0.70, 0.70)];
  const CHEST = [V(0, 3.0, 0.5), V(0.95, 0.70, 0.72)];
  const HUMP = [V(0, 3.35, -0.05), V(0.9, 0.75, 0.8)];
  blob(...HIPS, F, name + '_hips', g);
  blob(...BELLY, F, name + '_belly', g);
  blob(...CHEST, F, name + '_chest', g, V(0.3, 0, 0));
  blob(...HUMP, o.skin2, name + '_hump', g);
  for (const s of [1, -1]) blob(V(s * 0.88, 3.35, 0.32), V(0.52, 0.46, 0.52), F, name + '_trap_' + (s > 0 ? 'l' : 'r'), g);
  blob(V(0, 3.33, 0.95), V(0.36, 0.32, 0.42), F, name + '_neck', g);

  /* head */
  const head = new THREE.Group(); head.name = name + '_head';
  head.position.set(0, swing ? 3.36 : 3.12, 1.30);
  head.rotation.set(swing ? -0.28 : 0.12, swing ? 0.12 : R(-0.25, 0.25), swing ? 0.06 : 0.14);
  g.add(head);
  blob(V(0, 0.05, 0), V(0.37, 0.31, 0.39), F, name + '_cranium', head);
  blob(V(0, 0.13, 0.26), V(0.37, 0.10, 0.15), F, name + '_brow', head);
  blob(V(0, -0.03, 0.37), V(0.10, 0.13, 0.11), F, name + '_nose', head);
  for (const s of [1, -1]) {
    const sd = s > 0 ? 'l' : 'r';
    blob(V(s * 0.14, 0.04, 0.30), V(0.07, 0.06, 0.05), M.void, name + '_socket_' + sd, head);
    add(new THREE.SphereGeometry(0.032, 8, 7), M.eye, name + '_eye_' + sd, head).position.set(s * 0.14, 0.04, 0.335);
    const ear = add(new THREE.ConeGeometry(0.1, 0.38, 6), F, name + '_ear_' + sd, head);
    ear.position.set(s * 0.40, 0.04, -0.02); ear.rotation.set(0, 0, -s * (Math.PI / 2 + 0.35)); ear.scale.z = 0.4;
  }
  for (let i = 0; i < 5; i++) {
    const t = add(new THREE.BoxGeometry(0.045, 0.06, 0.04), M.tooth, name + '_upper_tooth_' + i, head);
    t.position.set((i - 2) * 0.07, -0.13, 0.31 - Math.abs(i - 2) * 0.03);
  }
  blob(V(0, -0.15, 0.22), V(0.26, 0.05, 0.12), M.void, name + '_maw', head);
  const jaw = new THREE.Group(); jaw.name = name + '_jaw';
  jaw.position.set(0, -0.12, -0.05); jaw.rotation.x = swing ? 0.42 : 0.18;
  head.add(jaw);
  blob(V(0, -0.10, 0.20), V(0.34, 0.15, 0.30), F, name + '_mandible', jaw);
  for (const s of [1, -1]) {
    const tusk = add(new THREE.ConeGeometry(0.05, 0.24, 7), M.tooth, name + '_tusk_' + (s > 0 ? 'l' : 'r'), jaw);
    tusk.position.set(s * 0.19, 0.06, 0.38); tusk.rotation.set(-0.2, 0, -s * 0.18);
  }
  for (let i = 0; i < 6; i++) {
    const a = V(R(-0.18, 0.18), 0.3, R(-0.25, 0.05));
    bar(a, a.clone().add(V(R(-0.25, 0.25), R(-0.35, -0.15), R(-0.45, -0.3))), 0.016, 0.004, name + '_hair_' + i, M.hair, head, 4);
  }

  /* arms. Returns the fist centre (grip) and forearm direction. */
  const HAND = { fist: [[V(0, 0.2, 0.02), V(0.27, 0.25, 0.24)]], knuckles: [-0.15, -0.05, 0.05, 0.15].map((x) => V(x, 0.36, 0.12)) };
  function arm(s, E, W, type) {
    const sd = s > 0 ? 'l' : 'r';
    const S = V(s * 1.12, 3.2, 0.45);
    blob(S, V(0.40, 0.40, 0.40), F, name + '_deltoid_' + sd, g);
    bar(S, E, 0.33, 0.27, name + '_upperarm_' + sd, F, g, 12);
    sausage(S, E, 0.45, 0.37, 0.52, F, name + '_bicep_' + sd, g);
    blob(E, V(0.28, 0.28, 0.28), F, name + '_elbow_' + sd, g);
    bar(E, W, 0.30, 0.21, name + '_forearm_' + sd, F, g, 12);
    sausage(E, W, 0.3, 0.35, 0.48, F, name + '_forearm_mass_' + sd, g);
    const dir = W.clone().sub(E).normalize();
    const hand = new THREE.Group(); hand.name = name + '_hand_' + sd;
    hand.position.copy(W); hand.quaternion.setFromUnitVectors(Y, dir);
    g.add(hand);
    if (type === 'fist') {
      blob(...HAND.fist[0], F, name + '_fist_' + sd, hand);
      HAND.knuckles.forEach((k, i) => blob(k, V(0.08, 0.08, 0.08), F, name + '_knuckle_' + sd + '_' + i, hand));
      blob(V(-s * 0.2, 0.2, 0.12), V(0.09, 0.12, 0.09), F, name + '_thumb_' + sd, hand);
    } else {
      blob(V(0, 0.17, 0), V(0.25, 0.21, 0.13), F, name + '_palm_' + sd, hand);
      [-0.16, -0.055, 0.055, 0.16].forEach((x, i) => {
        const a = V(x, 0.3, 0), b = V(x * 1.2, 0.52, 0.08), c = V(x * 1.25, 0.66, 0.20);
        bar(a, b, 0.065, 0.055, name + '_finger_' + sd + '_' + i + 'a', F, hand, 7);
        bar(b, c, 0.055, 0.04, name + '_finger_' + sd + '_' + i + 'b', F, hand, 7);
        const claw = add(new THREE.ConeGeometry(0.035, 0.12, 5), M.tooth, name + '_claw_' + sd + '_' + i, hand);
        claw.position.copy(c).add(V(0, 0.02, 0.05)); claw.rotation.x = 0.9;
      });
    }
    return { grip: W.clone().add(dir.clone().multiplyScalar(0.2)), dir, W, E };
  }
  /* lowest point of a fist relative to the wrist, for a given forearm dir */
  function fistLow(dir) {
    const q = new THREE.Quaternion().setFromUnitVectors(Y, dir);
    let low = Infinity;
    HAND.knuckles.forEach((k) => { low = Math.min(low, k.clone().applyQuaternion(q).y - 0.08); });
    const [c, r] = HAND.fist[0];
    for (let i = 0; i < 64; i++) {
      const th = (i % 8) / 8 * 6.283, ph = Math.floor(i / 8) / 7 * Math.PI;
      const p = V(c.x + r.x * Math.sin(ph) * Math.cos(th), c.y + r.y * Math.cos(ph), c.z + r.z * Math.sin(ph) * Math.sin(th));
      low = Math.min(low, p.applyQuaternion(q).y);
    }
    return low;
  }
  /* an iron shackle on the forearm; when the chain is left on, it hangs from
     the cuff's outer edge and stops short of the ground */
  function shackle(a, s, chain) {
    const sd = s > 0 ? 'l' : 'r';
    const c = a.W.clone().sub(a.dir.clone().multiplyScalar(0.34));
    const rc = 0.31;
    const cuff = add(new THREE.TorusGeometry(rc, 0.055, 6, 16), M.iron, name + '_shackle_' + sd, g);
    cuff.position.copy(c); cuff.quaternion.setFromUnitVectors(V(0, 0, 1), a.dir);
    if (!chain) return;
    const u = V(s, 0, 0).sub(a.dir.clone().multiplyScalar(a.dir.x * s)).normalize();
    const top = c.clone().add(u.clone().multiplyScalar(rc + 0.02));
    for (let i = 0; i < 9; i++) {
      const y = top.y - 0.04 - i * 0.105;
      if (y - 0.075 < 0.04) break;
      const link = add(new THREE.TorusGeometry(0.056, 0.017, 5, 10), M.iron, name + '_chain_' + sd + '_' + i, g);
      link.position.set(top.x + u.x * 0.04, y, top.z + u.z * 0.04); link.scale.y = 1.25;
      link.rotation.y = (i % 2) * Math.PI / 2 + Math.atan2(u.x, u.z);
    }
  }

  if (swing) {
    /* club hauled back over the head, the other claw reaching for the enemy */
    const ra = arm(1, V(1.58, 4.15, 0.25), V(1.05, 5.02, -0.30), 'fist');
    const cd = V(-0.32, 0.52, -1).normalize();
    const cl = club(g, name + '_club', 3.0, 0.30);
    cl.position.copy(ra.grip).sub(cd.clone().multiplyScalar(0.38));
    cl.quaternion.setFromUnitVectors(Y, cd);
    shackle(ra, 1, false);
    const la = arm(-1, V(-1.48, 2.55, 1.05), V(-1.22, 1.92, 1.88), 'claw');
    shackle(la, -1, true);
  } else {
    /* club dragged behind through the dirt, knuckles of the other hand down */
    const ra = arm(1, V(1.46, 2.30, 0.45), V(1.40, 1.35, 0.58), 'fist');
    const hr = 0.32, H = V(1.15, hr * 1.05, -2.15);
    const cd = H.clone().sub(ra.grip).normalize();
    const cl = club(g, name + '_club', 0.38 + H.distanceTo(ra.grip), hr);
    cl.position.copy(ra.grip).sub(cd.clone().multiplyScalar(0.38));
    cl.quaternion.setFromUnitVectors(Y, cd);
    shackle(ra, 1, true);
    const E = V(-1.50, 1.85, 0.95), W = V(-1.38, 0.6, 1.52);
    for (let i = 0; i < 5; i++) W.y -= W.y + fistLow(W.clone().sub(E).normalize());
    const la = arm(-1, E, W, 'fist');
    shackle(la, -1, true);
  }

  /* rot: bruised patches, pale boils, a flank torn open to the ribs */
  for (let i = 0; i < 7; i++) {
    const [c, r] = pick([HUMP, CHEST, BELLY]);
    const p = onSurf(c, r, V(R(-1, 1), R(-0.3, 1), R(-1, 1)));
    blob(p, V(R(0.12, 0.24), R(0.10, 0.2), R(0.12, 0.24)), M.bruise, name + '_rot_' + i, g);
  }
  for (let i = 0; i < 12; i++) {
    const [c, r] = pick([HUMP, CHEST, HUMP]);
    add(new THREE.SphereGeometry(R(0.035, 0.075), 8, 6), M.pale, name + '_boil_' + i, g).position.copy(onSurf(c, r, V(R(-1, 1), R(0, 1), R(-1, 0.6))));
  }
  {
    const u = V(swing ? 0.85 : -0.85, -0.15, 0.5).normalize();
    const p = onSurf(...CHEST, u);
    blob(p.clone().sub(u.clone().multiplyScalar(0.06)), V(0.26, 0.36, 0.26), M.gore, name + '_torn_flank', g);
    const uh = V(u.x, 0, u.z).normalize();
    for (let i = 0; i < 3; i++) {
      const rib = add(new THREE.TorusGeometry(0.34, 0.036, 6, 12, 1.1), M.bone, name + '_exposed_rib_' + i, g);
      rib.position.copy(p).sub(uh.clone().multiplyScalar(0.30)).add(V(0, (i - 1) * 0.17, 0));
      rib.rotation.set(Math.PI / 2, 0.55 - Math.atan2(uh.z, uh.x), 0, 'YXZ');
    }
    /* a stitched seam across the belly where someone tried to hold it shut */
    const a = onSurf(...BELLY, V(0.35, 0.40, 0.85)), b = onSurf(...BELLY, V(-0.35, -0.30, 0.9));
    bar(a, b, 0.018, 0.018, name + '_seam', M.gore, g, 5);
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    for (let i = 0; i <= 7; i++) {
      const st = add(new THREE.BoxGeometry(0.16, 0.022, 0.03), M.sinew, name + '_stitch_' + i, g);
      st.position.copy(a.clone().lerp(b, i / 7)).add(V(0, 0, 0.02)); st.rotation.z = ang + Math.PI / 2;
    }
  }
  /* the battlefield's leavings, still stuck in its back */
  for (let i = 0; i < 8; i++) {
    const u = V(R(-0.8, 0.8), R(0.1, 0.9), R(-1, -0.35)).normalize();
    const p = onSurf(...HUMP, u);
    const out = u.clone().add(V(R(-0.3, 0.3), R(-0.1, 0.3), R(-0.2, 0.2))).normalize();
    const spear = i % 3 === 0;
    const len = spear ? R(0.9, 1.4) : R(0.34, 0.48);
    const a = p.clone().sub(out.clone().multiplyScalar(0.18)), b = p.clone().add(out.clone().multiplyScalar(len));
    if (spear) {
      bar(a, b, 0.032, 0.03, name + '_spear_' + i, M.wood, g, 7);
      const snap = add(new THREE.ConeGeometry(0.032, 0.09, 5), M.wood, name + '_spear_snap_' + i, g);
      snap.position.copy(b).add(out.clone().multiplyScalar(0.04)); snap.quaternion.setFromUnitVectors(Y, out);
      const rag = add(new THREE.BoxGeometry(0.08, 0.34, 0.012), M.cloth, name + '_spear_rag_' + i, g);
      rag.position.copy(b).sub(out.clone().multiplyScalar(0.12)).add(V(0, -0.15, 0));
    } else bolt(g, name + '_bolt_' + i, a, b, 0.013);
  }

  /* belt of rope and a hide loincloth, with a trophy skull knotted on */
  const belt = add(new THREE.TorusGeometry(1, 0.055, 6, 28), M.leather, name + '_belt', g);
  belt.position.set(0, 2.12, 0.2); belt.rotation.x = Math.PI / 2; belt.scale.set(0.8, 0.83, 1);
  [[1, 1.0], [-1, -0.62]].forEach(([face, z]) => {
    for (let i = -1; i <= 1; i++) {
      const drop = R(0.6, face > 0 ? 0.9 : 1.05);
      const st = add(new THREE.BoxGeometry(0.28, drop, 0.03), M.leather, name + '_loincloth_' + (face > 0 ? 'f' : 'b') + (i + 1), g);
      st.position.set(i * 0.26 + R(-0.03, 0.03), 2.12 - drop * 0.5, z + face * 0.02);
      st.rotation.set(-face * R(0.04, 0.16), R(-0.1, 0.1), R(-0.1, 0.1));
    }
  });
  {
    const k = V(-0.72, 2.1, 0.62), sk = V(-0.80, 1.62, 0.78);
    bar(k, sk.clone().add(V(0, 0.12, 0)), 0.02, 0.02, name + '_trophy_cord', M.hair, g, 5);
    blob(sk, V(0.13, 0.14, 0.14), M.bone, name + '_trophy_skull', g);
    for (const s of [1, -1]) blob(sk.clone().add(V(s * 0.05, 0.01, 0.11)), V(0.035, 0.035, 0.02), M.void, name + '_trophy_socket_' + (s > 0 ? 'l' : 'r'), g);
  }
  return g;
}
const pick = (a) => a[Math.floor(rnd() * a.length) % a.length];

/* ============================ THE PAIR ============================ */
const TROLLS = [
  { name: 'troll_swinger', pose: 'swing', skin: M.hide, skin2: M.hideDk, at: V(-1.9, 0, 0.7), rot: 0.28 },
  { name: 'troll_dragger', pose: 'drag', skin: M.hideDk, skin2: M.hide, at: V(2.1, 0, -0.9), rot: -0.35 },
];
TROLLS.forEach((t) => {
  const g = troll(t);
  g.position.copy(t.at); g.rotation.y = t.rot;
  rig.add(g);
});

/* what they have already walked through: smashed shields, planks, bones */
const toWorld = (t, p) => p.clone().applyAxisAngle(Y, t.rot).add(t.at);
const keepOut = [
  ...TROLLS.map((t) => [t.at, 1.7]),
  [toWorld(TROLLS[1], V(-1.38, 0, 1.55)), 0.6],
  [toWorld(TROLLS[1], V(1.15, 0, -2.15)), 0.7],
];
const spot = () => {
  for (;;) {
    const p = V(R(-4.5, 4.5), 0, R(-3.5, 3.5));
    if (keepOut.every(([c, r]) => Math.hypot(p.x - c.x, p.z - c.z) > r)) return p;
  }
};
for (let i = 0; i < 7; i++) {
  const p = spot(), plank = add(new THREE.BoxGeometry(R(0.5, 1.0), 0.05, R(0.12, 0.2)), M.wood, 'smashed_plank_' + i, rig);
  plank.position.set(p.x, 0.025, p.z); plank.rotation.y = R(0, 3.14);
}
for (let i = 0; i < 3; i++) {
  const p = spot(), sh = add(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 16), M.wood, 'crushed_shield_' + i, rig);
  sh.position.set(p.x, 0.025, p.z);
  const rim = add(new THREE.TorusGeometry(0.3, 0.025, 5, 18), M.rust, 'crushed_shield_rim_' + i, rig);
  rim.position.set(p.x, 0.025, p.z); rim.rotation.x = Math.PI / 2;
}
for (let i = 0; i < 14; i++) {
  const p = spot(), r = R(0.022, 0.032);
  p.y = r * 1.5;
  bar(p, p.clone().add(V(R(-0.34, 0.34), R(0, 0.03), R(-0.34, 0.34))), r, r * 0.88, 'scattered_bone_' + i, M.bone, rig, 6);
}
{
  const p = spot();
  add(new THREE.SphereGeometry(0.135, 12, 10), M.bone, 'crushed_skull', rig).position.set(p.x, 0.10, p.z);
  rig.children.at(-1).scale.y = 0.74;
}

/* seat the dragged club: measure its non-spike parts and lift it so the head
   rests exactly on y = 0 (knots and gore on the head reach lower than the sphere) */
rig.updateMatrixWorld(true);
{
  const cl = rig.getObjectByName('troll_dragger_club');
  const bb = new THREE.Box3();
  cl.traverse((m) => { if (m.isMesh && !m.name.includes('_spike_')) bb.union(new THREE.Box3().setFromObject(m, true)); });
  cl.position.y -= bb.min.y;
}
/* spikes that would bury into the ground on the dragged club are hammered flat */
rig.updateMatrixWorld(true);
const doomed = [];
rig.traverse((m) => { if (m.isMesh && m.name.includes('_spike_') && new THREE.Box3().setFromObject(m, true).min.y < 0.005) doomed.push(m); });
doomed.forEach((m) => m.parent.remove(m));

rig.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(rig);
const c = box.getCenter(V());
const wrap = new THREE.Group(); wrap.name = 'zombie_trolls';
rig.position.set(-c.x, 0, -c.z);   // ground is y = 0 by construction
wrap.add(rig);
stage.setObject(wrap);
</script>
