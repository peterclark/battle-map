name: Badges

# Runs after CI finishes on main and publishes shields.io endpoint JSON to the
# orphan `badges` branch.
#
# Keeping badge data on a branch rather than in a third-party coverage service
# means no external account, no upload token, and nothing to expire. The only
# credential involved is the built-in GITHUB_TOKEN.
#
# This repository is public, so shields.io — which fetches anonymously — can
# read the files it needs. That is load-bearing: on a private repository both
# raw.githubusercontent.com and GitHub's own workflow badge return 404 to
# anyone not signed in, and a badge pasted into a résumé renders broken for
# every reader. See docs/ci-and-badges.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  publish:
    name: Publish badge data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The coverage report belongs to the CI run that triggered this workflow,
      # not to the latest run of anything.
      - name: Download coverage from the CI run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate badge data
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          mkdir -p badges

          # A build badge of our own, mirroring the CI run that triggered this.
          # GitHub's built-in workflow badge would do here — the repository is
          # public — but publishing both from one place keeps them in step and
          # keeps the private-repo fallback one setting away.
          if [ "$CI_CONCLUSION" = "success" ]; then
            BUILD_MSG="passing"; BUILD_COLOR="brightgreen"
          else
            BUILD_MSG="failing"; BUILD_COLOR="red"
          fi
          printf '{\n  "schemaVersion": 1,\n  "label": "build",\n  "message": "%s",\n  "color": "%s"\n}\n' \
            "$BUILD_MSG" "$BUILD_COLOR" > badges/build.json

          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-badge.mjs badges
          else
            echo "No coverage summary in the CI artifact; leaving the coverage badge as it was."
          fi

      - name: Commit to the badges branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `badges` is an orphan branch: badge data only, none of the project's
          # history, so it stays a couple of kilobytes forever.
          git fetch origin badges --depth=1 || true
          if git show-ref --quiet refs/remotes/origin/badges; then
            git worktree add /tmp/badges badges
          else
            git worktree add --detach /tmp/badges
            git -C /tmp/badges checkout --orphan badges
            git -C /tmp/badges rm -rf . >/dev/null 2>&1 || true
          fi

          cp badges/*.json /tmp/badges/
          cd /tmp/badges
          git add -A
          if git diff --cached --quiet; then
            echo "Badge data unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(badges): update from ${GITHUB_SHA::7}"
          git push origin badges
